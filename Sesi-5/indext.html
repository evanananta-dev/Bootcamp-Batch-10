<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store - Official Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body class="bg-light text-dark">
    <nav class="navbar navbar-expand-md sticky-top py-2 bg-white border-bottom">
      <div class="container">
        <a
          class="navbar-brand text-dark d-flex align-items-center gap-2 fw-semibold fs-6"
          href="index.html"
        >
          <i class="fa-brands fa-xl text-dark"></i> <span>AppStore</span>
        </a>

        <button
          class="navbar-toggler border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="d-flex align-items-center justify-content-center gap-3">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm rounded-pill"
            onclick="resetCart()"
          >
            <i class="fa-solid fa-trash-can me-1"></i>Reset Tas
          </button>
          <a
            href="cart.html"
            class="text-dark text-decoration-none position-relative"
          >
            <i class="fa-solid fa-bag-shopping fs-5"></i>
            <span
              id="bagBadge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary"
              style="font-size: 10px; display: none"
              >0</span
            >
          </a>
        </div>
      </div>
    </nav>

    <section class="bg-black text-white text-center py-5">
      <div class="container py-5">
        <h1 class="display-3 fw-bold mb-1">Jelajahi Produk Kami</h1>
        <div class="d-flex justify-content-center gap-3 mb-5 py-2">
          <a
            href="#store-products"
            class="btn btn-primary rounded-pill px-4 py-2"
            >Pelajari Lebih Lanjut</a
          >
        </div>
      </div>
    </section>

    <section id="store-products" class="py-5 bg-white">
      <div class="container py-4">
        <div class="container pb-5">
          <div class="row g-3 mb-4">
            <div class="col-md-5">
              <label for="search-input" class="form-label"> Cari produk </label>
              <input
                type="text"
                id="search-input"
                class="form-control"
                placeholder="Contoh: AppPhone"
              />
            </div>

            <div class="col-md-4">
              <label for="category-filter" class="form-label"> Kategori </label>
              <select id="category-filter" class="form-select">
                <option value="all">Semua kategori</option>
                <option value="Phone">Phone</option>
                <option value="Laptop">Laptop</option>
                <option value="Tablet">Tablet</option>
              </select>
            </div>

            <div class="col-md-3">
              <label for="sort-filter" class="form-label">
                Urutkan harga
              </label>
              <select id="sort-filter" class="form-select">
                <option value="default">Default</option>
                <option value="price-low-high">Harga: Rendah ke Tinggi</option>
                <option value="price-high-low">Harga: Tinggi ke Rendah</option>
              </select>
            </div>
          </div>

          <p id="product-count" class="text-secondary"></p>

          <!-- Satu-satunya container produk. ID harus sama dengan di JS -->
          <div id="product-list" class="row g-4"></div>

          <div id="empty-message" class="text-center py-5 d-none">
            <h4>Produk tidak ditemukan</h4>
            <p class="text-secondary">Coba kata kunci atau kategori lainnya.</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="bg-light py-4 text-secondary small border-top">
      <div class="container">
        <div
          class="d-md-flex justify-content-between align-items-center text-center text-md-start"
        >
          <p class="mb-2 mb-md-0">&copy; 2026 Store.</p>
          <div class="d-flex justify-content-center gap-3">
          </div>
        </div>
      </div>
    </footer>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
      <div
        id="cartToast"
        class="toast align-items-center text-white bg-dark border-0 rounded-3 shadow"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastText">
            Produk berhasil ditambahkan ke tas belanja.
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
