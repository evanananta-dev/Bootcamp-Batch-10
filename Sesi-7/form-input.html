<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk - Store</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
    </style>
</head>
<body class="bg-light text-dark d-flex align-items-center justify-content-center min-vh-100">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border rounded-4 p-4 p-md-5 bg-white">

                    <div class="text-center mb-4">
                        <i class="fa-brands fa-3x mb-2 text-dark"></i>
                        <h2 class="fw-bold fs-3">Tambah Produk Baru</h2>
                        <p class="text-secondary small">Masukkan detail produk sesuai spesifikasi toko.</p>
                    </div>

                    <form action="form-tambah.php" method="POST">
                        <div class="mb-3">
                            <label for="nama_produk" class="form-label fw-semibold small">Nama Produk</label>
                            <input type="text" class="form-control rounded-3 py-2" id="nama_produk" name="nama_produk"
                                   required maxlength="100" placeholder="Contoh: AppPhone X12 Pro">
                        </div>

                        <div class="mb-3">
                            <label for="harga" class="form-label fw-semibold small">Harga (IDR)</label>
                            <input type="number" class="form-control rounded-3 py-2" id="harga" name="harga"
                                   required min="1" placeholder="15999000">
                        </div>

                        <div class="mb-3">
                            <label for="kategori" class="form-label fw-semibold small">Kategori</label>
                            <select class="form-select rounded-3 py-2" id="kategori" name="kategori" required>
                                <option value="" disabled selected>Pilih Kategori</option>
                                <option value="Phone">Phone</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Tablet">Tablet</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="stok" class="form-label fw-semibold small">Stok</label>
                            <input type="number" class="form-control rounded-3 py-2" id="stok" name="stok"
                                   required min="0" placeholder="Contoh: 25">
                        </div>

                        <div class="mb-3">
                            <label for="deskripsi" class="form-label fw-semibold small">Deskripsi</label>
                            <textarea class="form-control rounded-3 py-2" id="deskripsi" name="deskripsi"
                                      rows="4" required maxlength="500"
                                      placeholder="Jelaskan spesifikasi dan keunggulan produk (maks. 500 karakter)"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="gambar_url" class="form-label fw-semibold small">URL Gambar Produk</label>
                            <input type="url" class="form-control rounded-3 py-2" id="gambar_url" name="gambar_url"
                                   required placeholder="https://placehold.co/300x300/eee/333?text=Product">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm">
                            <i class="fa-solid fa-plus me-2"></i>Simpan Produk
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
